<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>개성 사회, 누구로 태어날까</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--bg:#f2f6fd;--tx:#0f1b33;--mu:#5a6785;--pn:#fff;--ln:#d3def2;--ac:#2563eb;--ac2:#dbe7ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1526;--tx:#e8eeff;--mu:#9fb0d6;--pn:#16213a;--ln:#25365c;--ac:#2f6bff;--ac2:#22376a;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0e1526;--tx:#e8eeff;--mu:#9fb0d6;--pn:#16213a;--ln:#25365c;--ac:#2f6bff;--ac2:#22376a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg) linear-gradient(var(--ac2),transparent 320px) no-repeat;color:var(--tx);font:400 16px/1.6 "Noto Sans KR",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px;display:grid;gap:18px}
h1,h2,h3,.age,.ct b{font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-weight:400;margin:0}
h1{font-size:clamp(36px,10vw,58px);line-height:1.08;text-shadow:3px 3px 0 var(--ac)}
h2{font-size:24px}h3{font-size:18px}p{margin:.4em 0}
.mu{color:var(--mu);font-size:14px}.lead{font-size:17px;max-width:34em}
.pn{background:var(--pn);border:1px solid var(--ln);border-radius:14px;box-shadow:0 8px 24px -14px rgba(37,99,235,.45);padding:18px}
.ht{background:radial-gradient(circle,var(--ln) 1.3px,transparent 1.7px) 0 0/9px 9px,var(--pn)}
.b{font:700 16px "Noto Sans KR",sans-serif;background:var(--ac);color:#fff;border:1px solid var(--ac);border-radius:10px;padding:11px 20px;cursor:pointer;transition:filter .15s}
.b.g{background:var(--pn);color:var(--tx);border-color:var(--ln)}
.b:hover{filter:brightness(1.07)}.b:active{transform:translateY(1px)}
:focus-visible{outline:3px solid var(--ac);outline-offset:3px}
select,input{font:inherit;color:var(--tx);background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:9px;max-width:100%}
input{width:100%;margin:6px 0 12px}
label{display:block;margin-bottom:12px;font-weight:500}label select{display:block;margin-top:4px}
.rw{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.ct{display:grid;grid-template-columns:1fr 1fr;gap:12px}.ct div{border-left:4px solid var(--ac);padding-left:10px}
.ct b{display:block;font-size:34px;line-height:1.1}.ct span{font-size:13px;color:var(--mu)}
.age{font-size:64px;line-height:1;color:var(--ac)}.age b{font:inherit}
.m{display:grid;grid-template-columns:3.4em 1fr 2.2em;gap:8px;align-items:center;margin:5px 0;font-size:14px}
.m i{display:block;height:10px;border-radius:6px;background:linear-gradient(90deg,var(--ac) var(--v),var(--ac2) var(--v))}
.m b{text-align:right}
.lg{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:6px}
.lg li{padding:6px 0 6px 12px;border-left:4px solid var(--ac)}
ul.me{list-style:none;padding:0;display:grid;gap:12px}
.ov{position:fixed;inset:0;background:rgba(8,10,25,.72);display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));z-index:5}
.ov .pn{max-width:480px;width:100%;max-height:100%;overflow:auto}
.os{display:grid;gap:10px}.q{font-weight:700}.ep{font-size:20px;font-weight:700}
[hidden]{display:none!important}
footer{font-size:13px;color:var(--mu)}
.tl{display:flex;justify-content:space-between;font-size:13px;color:var(--mu);margin-bottom:6px}
.yb{height:14px;border-radius:8px;background:var(--ac2);overflow:hidden}
.yb i{display:block;height:100%;width:0;background:var(--ac);border-radius:8px}
.lb{position:relative;height:8px;border-radius:6px;background:var(--ac2);margin-top:20px}
.lb i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--ac);opacity:.6}
.lb .k{position:absolute;top:-5px;width:2px;height:18px;background:var(--mu)}
.lb .k::after{content:attr(data-a);position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--mu)}
details{margin:6px 0}summary{cursor:pointer;font-weight:700;padding:4px 0}

.bd{display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:10px 0 0;list-style:none}.bd li{background:var(--ac2);border-radius:20px;padding:4px 12px;font-size:14px;font-weight:500}
.os .b{text-align:left}
.sb{display:flex;gap:2px;height:12px;margin:8px 0}.sb i{display:block;min-width:4px;border-radius:3px}
.lg2{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;margin-bottom:6px}.lg2 u{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;text-decoration:none}
.tp{border:1px solid var(--ln);border-left:5px solid var(--c);border-radius:10px;padding:2px 12px;margin:8px 0}.tp summary b{color:var(--c)}
.qs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 10px}.qc{display:inline-flex;gap:6px;align-items:baseline;border:1px solid var(--c);border-radius:16px;padding:2px 10px;font-size:13px;background:color-mix(in srgb,var(--c) 10%,transparent)}.qc em{font-style:normal;font-size:11px;color:var(--mu)}.qc b{color:var(--c)}.lg li:first-child{background:var(--ac2);border-radius:0 8px 8px 0}

main{padding-bottom:88px}
.nf{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:4;font:700 14px "Noto Sans KR",sans-serif;color:#f6e3b4;background:linear-gradient(#5a3a22,#3a2314);border:1px solid #c9a25a;border-radius:24px;padding:10px 16px;cursor:pointer;box-shadow:0 6px 18px -6px rgba(0,0,0,.6)}
.nf:hover{filter:brightness(1.15)}
.nv{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,rgba(48,28,12,.8),rgba(6,4,2,.94));padding:calc(14px + env(safe-area-inset-top,0px)) 12px calc(14px + env(safe-area-inset-bottom,0px))}
.bk{position:relative;display:grid;grid-template-columns:1fr 1fr;width:min(960px,100%);height:min(620px,100%);perspective:2200px;padding:12px;border-radius:14px;background:linear-gradient(#4a2e1a,#2e1b0e);box-shadow:0 30px 70px -20px #000,inset 0 0 0 2px rgba(201,162,90,.4)}
.pg{position:relative;min-height:0;overflow:auto;padding:22px 26px;color:#3a2a1a;font:400 15px/1.7 "Noto Sans KR",sans-serif}
.pl{border-radius:8px 0 0 8px;background:linear-gradient(90deg,#efe0bd,#f6ecd2 90%,#cdb98f)}
.pr{border-radius:0 8px 8px 0;transform-origin:left center;background:linear-gradient(270deg,#efe0bd,#f6ecd2 90%,#cdb98f)}
.pr::before{content:"";position:absolute;top:0;right:52px;width:16px;height:46px;background:var(--c);clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%)}
.pg h2,.pg h3{color:#2b1b0c;margin:0}.pr h2{font-size:34px;margin:6px 0 2px}
.nx{position:absolute;top:6px;right:6px;z-index:5;width:32px;height:32px;border-radius:50%;border:1px solid #c9a25a;background:#3a2314;color:#f6e3b4;font-size:15px;cursor:pointer}
.ntb{display:flex;gap:4px;margin:10px 0 6px}.ntb button{flex:1;font:700 13px "Noto Sans KR",sans-serif;border:1px solid var(--c);color:var(--c);background:transparent;border-radius:6px;padding:5px 0;cursor:pointer}.ntb .on{background:var(--c);color:#fff}
.nmu{font-size:13px;opacity:.72;margin:6px 0}.nft{margin-top:12px}
.nli{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:2px}
.nli button{width:100%;display:flex;justify-content:space-between;align-items:baseline;background:none;border:0;border-bottom:1px dashed #b9a47a;color:inherit;font:inherit;padding:5px 8px;cursor:pointer;text-align:left}
.nli button:hover{background:rgba(0,0,0,.05)}.nli .on{background:color-mix(in srgb,var(--c) 16%,transparent);font-weight:700}.nli em{font-style:normal;font-size:12px;opacity:.65}
.nty{display:inline-block;margin:0;padding:1px 12px;border-radius:12px;background:var(--c);color:#fff;font-size:12px;font-weight:700}
.nsm{margin:0;font-weight:700;color:var(--c)}.nrule{height:2px;margin:10px 0;background:linear-gradient(90deg,var(--c),transparent)}
.nwk{padding:6px 10px;border-left:4px solid var(--c);border-radius:0 6px 6px 0;background:rgba(0,0,0,.05);font-size:14px}
.nst{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px;margin:12px 0}.nst div{border:1px solid #c9b48a;border-radius:8px;padding:6px 8px;background:rgba(255,250,240,.65)}.nst dt{font-size:11px;opacity:.65}.nst dd{margin:0;font-weight:700;font-size:14px}
.pip u{display:inline-block;width:12px;height:12px;margin-right:3px;border-radius:3px;background:#d4c19a;transform:skew(-12deg)}.pip .on{background:var(--c)}
.nnv{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:13px}.nnv button{border:0;border-radius:6px;background:#3a2314;color:#f6e3b4;font:700 13px "Noto Sans KR",sans-serif;padding:7px 12px;cursor:pointer}
.cv{display:none;position:absolute;left:50%;top:0;width:50%;height:100%;z-index:3;transform-origin:left center;backface-visibility:hidden;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#e9c97a;border-radius:0 14px 14px 0;box-shadow:inset 0 0 0 3px rgba(201,162,90,.55);background:radial-gradient(circle at 50% 42%,rgba(233,201,122,.22),transparent 46%),repeating-linear-gradient(45deg,rgba(255,255,255,.03) 0 3px,transparent 3px 6px),linear-gradient(#5a3a22,#33200f)}
.cv i{font-style:normal;font-size:34px;margin-bottom:10px}.cv b{font:400 clamp(26px,4vw,42px)/1.15 "Black Han Sans",sans-serif;text-shadow:0 2px 0 rgba(0,0,0,.6)}.cv span{margin-top:12px;font-size:13px;letter-spacing:.3em;opacity:.8}
.bk.op .cv{display:flex;animation:opn 1.2s .15s cubic-bezier(.6,0,.3,1) forwards}.bk.op .pl{animation:nfi .6s .7s both}
.fl{animation:nfl .5s ease}
@keyframes opn{to{transform:rotateY(-180deg)}}@keyframes nfi{from{opacity:0}to{opacity:1}}@keyframes nfl{from{transform:rotateY(-70deg);opacity:.2}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.bk.op .cv{display:none}.bk.op .pl,.fl{animation:none}}
@media(max-width:760px){.bk{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}.pl{border-radius:8px 8px 0 0;padding:14px 16px 8px}.pr{border-radius:0 0 8px 8px;padding:18px 18px}.pl h3,.pl .nmu{display:none}.ntb{margin-right:38px}.nli{display:flex;overflow-x:auto;gap:6px}.nli li{flex:none}.nli button{border:1px solid #b9a47a;border-radius:16px;white-space:nowrap;gap:8px}.cv{left:0;width:100%}}

main.sim{max-width:1100px}.lc{display:grid;gap:18px;align-content:start}.rc{min-width:0}
@media(min-width:900px){main.sim{grid-template-columns:minmax(0,5fr) minmax(0,6fr);align-items:start}.lc,.rc{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto}.rc{padding-right:6px}}
@media(max-width:899px){main.sim #st{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}}
.dl{display:inline-flex;flex-wrap:wrap;gap:4px;margin-left:6px;vertical-align:middle}.dl i{font:700 11px/18px "Noto Sans KR",sans-serif;font-style:normal;border-radius:10px;padding:0 7px}.dl .up{background:#d3f9d8;color:#1b6a2c}.dl .dn{background:#ffe3e3;color:#a61e1e}
.gd{font:400 18px "Black Han Sans",sans-serif;color:var(--ac);margin-left:6px}
#sc{display:grid;gap:14px;margin-bottom:16px}
.sx{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--ac2)}.sx i{display:block;height:100%}
.rr{display:grid;grid-template-columns:7.4em 1fr 4.6em;gap:8px;align-items:center;font-size:13px;margin:5px 0}.rr span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rr b{text-align:right;font-weight:500}.rr.on span,.rr.on b{color:var(--ac);font-weight:700}.rr.on .sx{box-shadow:0 0 0 2px var(--ac)}
main{grid-template-columns:minmax(0,1fr)}body{overflow-x:hidden}select{width:100%}.rw label{flex:1 1 150px;min-width:0}
#wn{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(440px,calc(100% - 24px));display:grid;gap:8px;z-index:20;pointer-events:none}
.wt{font:700 14px/1.4 "Noto Sans KR",sans-serif;border-radius:12px;padding:10px 14px;color:#fff;box-shadow:0 10px 24px -10px rgba(0,0,0,.6);animation:wti .35s ease}
.wt.warn{background:#d9480f}.wt.crit{background:#c92a2a;animation:wti .35s ease,wsh .5s .35s}.wt.good{background:#2b8a3e}
@keyframes wti{from{transform:translateY(-14px);opacity:0}}@keyframes wsh{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
#fx{position:fixed;inset:0;z-index:15;pointer-events:none;opacity:0;background:radial-gradient(circle,transparent 35%,rgba(255,70,70,.34))}
#fx.f{animation:fxp 1.6s ease-in-out 1}#fx.f.c{animation-iteration-count:2}@keyframes fxp{0%,50%,100%{opacity:0}25%,75%{opacity:1}}
.dgz::after{content:"";position:fixed;inset:0;z-index:14;pointer-events:none;background:radial-gradient(circle,transparent 45%,rgba(255,60,60,.22));animation:amb 2.4s ease-in-out infinite}@keyframes amb{50%{opacity:.35}}
.ov .pn.dgr{border-color:#e03131;animation:dgb 1.8s ease-in-out infinite}@keyframes dgb{50%{box-shadow:0 0 0 4px rgba(224,49,49,.35);background-color:color-mix(in srgb,#e03131 8%,var(--pn))}}
@media(prefers-reduced-motion:reduce){#fx.f{animation:fxs 1.2s}@keyframes fxs{0%,100%{opacity:0}30%{opacity:.6}}.dgz::after,.ov .pn.dgr,.wt{animation:none}}
.tb{display:none}
@media(max-width:899px){.tb{display:flex;gap:6px;align-items:center;position:sticky;top:0;z-index:6;margin:-20px -16px 0;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--ln)}
.tb button{flex:none;font:700 14px "Noto Sans KR",sans-serif;padding:7px 12px;border-radius:18px;border:1px solid var(--ln);background:var(--pn);color:var(--tx);cursor:pointer}.tb .on{background:var(--ac);color:#fff;border-color:var(--ac)}.tb span{margin-left:auto;font-size:13px;color:var(--mu);white-space:nowrap}
main.sim[data-t=me] #sc,main.sim[data-t=soc] .lc,main.sim[data-t=soc] .rc>:not(#sc),main.sim[data-t=log] .lc,main.sim[data-t=log] #sc{display:none}main.sim[data-t=me] #fd li:nth-child(n+4){display:none}}
@media(max-width:480px){.pn{padding:14px}h2{font-size:21px}.age{font-size:52px}.rr{grid-template-columns:6.4em 1fr 4.2em;font-size:12.5px}.ep{font-size:18px}.nf{padding:9px 13px}}
.hvb{position:relative;display:flex;height:22px;border-radius:11px;overflow:hidden;background:#e03131}.hvb i{display:flex;align-items:center;height:100%;font-style:normal;min-width:0;overflow:hidden;padding:0 7px}.hvb i:first-child{background:linear-gradient(90deg,#1864ab,#339af0)}.hvb i.v{flex:1;justify-content:flex-end;background:linear-gradient(90deg,#e03131,#a61e1e)}.hvb b{font:700 11px/1 "Noto Sans KR",sans-serif;color:#fff;white-space:nowrap}.hvb u{position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:#fff;opacity:.85}.rr.on .hvb{box-shadow:0 0 0 2px var(--ac)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;gap:6px;margin:10px 0 10px}.vs small{display:block;font-size:12px;color:var(--mu)}.vs b{font:400 36px/1.1 "Black Han Sans",sans-serif}.vs .h b{color:#1c7ed6}.vs .v b{color:#e03131}.vs strong{display:block;font:400 20px/1.2 "Black Han Sans",sans-serif;margin-bottom:4px}.vs .mid span{display:inline-block;color:#fff;font-size:12px;font-weight:700;border-radius:12px;padding:2px 10px}
.cz{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}.ck{border:1px solid var(--ln);border-top:4px solid var(--k);border-radius:12px;padding:10px 12px;display:grid;gap:4px;background:color-mix(in srgb,var(--k) 6%,var(--pn))}.ck small{font-size:12px;color:var(--mu)}.ck small strong{color:var(--tx)}.ck b{font:400 30px/1.1 "Black Han Sans",sans-serif;color:var(--k)}.ck b em{font:500 13px "Noto Sans KR",sans-serif;font-style:normal;margin-left:3px;color:var(--mu)}.sp{height:8px;border-radius:5px;overflow:hidden;background:color-mix(in srgb,var(--k) 25%,transparent)}.sp i{display:block;height:100%;background:var(--k)}
.rc>#sc{margin:16px 0 0}@media(min-width:900px){#fd{max-height:36vh;overflow:auto;padding-right:4px}}
.mxt{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:2px;font-size:11px;text-align:center}.mxt th{font-weight:500;color:var(--mu);padding:2px 0}.mxt th:first-child{width:3.8em;text-align:left}.mxt td{border-radius:5px;padding:6px 0;font-weight:700}.mxt td.on{outline:2px solid var(--tx);outline-offset:-1px}
.rr{grid-template-columns:8.4em 1fr 4.4em}@media(max-width:480px){.rr{grid-template-columns:7.2em 1fr 4em;font-size:12px}}

/* ===== v4: 연출 · 연대기 · 편의 ===== */
#qcv{position:fixed;inset:0;width:100%;height:100%;z-index:16;pointer-events:none}
#qe{position:fixed;inset:0;z-index:17;pointer-events:none;opacity:0;border-radius:0}
#qe.on{animation:qeo 1.7s ease-out 1}
@keyframes qeo{0%{opacity:0}10%{opacity:1}45%{opacity:.85}100%{opacity:0}}
#qb{position:fixed;left:0;right:0;top:26%;z-index:18;pointer-events:none;text-align:center;opacity:0;padding:14px 16px 16px;color:#fff;background:linear-gradient(90deg,transparent,rgba(8,10,25,.82) 16% 84%,transparent);border-top:2px solid var(--c,#fff);border-bottom:2px solid var(--c,#fff);text-shadow:0 2px 10px rgba(0,0,0,.6)}
#qb.on{animation:qbi 2.6s cubic-bezier(.2,.8,.2,1) 1}
#qb small{display:block;font:700 12px "Noto Sans KR",sans-serif;letter-spacing:.32em;color:var(--c,#fff);margin-bottom:2px}
#qb b{display:block;font:400 clamp(30px,8vw,56px)/1.12 "Black Han Sans","Noto Sans KR",sans-serif;text-shadow:0 0 18px var(--c,#fff),0 3px 0 rgba(0,0,0,.55)}
#qb span{display:block;font:500 14px "Noto Sans KR",sans-serif;opacity:.88;margin-top:4px}
@keyframes qbi{0%{opacity:0;transform:translateX(-14%) scaleY(.5)}12%{opacity:1;transform:none}78%{opacity:1;transform:none}100%{opacity:0;transform:translateX(10%)}}
.shk{animation:shk .5s ease 1}
@keyframes shk{10%{transform:translate(-5px,3px)}30%{transform:translate(5px,-4px)}50%{transform:translate(-4px,-2px)}70%{transform:translate(3px,3px)}90%{transform:translate(-2px,1px)}}
@media(prefers-reduced-motion:reduce){#qe.on{animation:qef 1.4s ease-out 1}@keyframes qef{0%,100%{opacity:0}25%{opacity:.7}}#qb.on{animation:qbf 2.4s ease 1}@keyframes qbf{0%,100%{opacity:0}15%,80%{opacity:1}}.shk{animation:none}}
.wt.lore{background:#5f3dc4}
.lr{display:block;margin-top:5px;padding:6px 10px;border-left:3px solid #7048e8;border-radius:0 8px 8px 0;background:color-mix(in srgb,#7048e8 10%,transparent);font-size:13px;line-height:1.55;color:var(--mu)}
.lr.e{border-left-color:#e03131;background:color-mix(in srgb,#e03131 9%,transparent)}
.lr b{display:block;font-size:12px;color:var(--tx)}
.fcs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.fchip{font:700 13px "Noto Sans KR",sans-serif;padding:4px 13px;border-radius:16px;border:1px solid var(--ln);background:var(--pn);color:var(--tx);cursor:pointer}
.fchip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.kh{font-size:12px;margin:10px 0 0}
.nfx{font:700 13px "Noto Sans KR",sans-serif;border:1px solid var(--c);color:var(--c);background:transparent;border-radius:16px;padding:5px 14px;cursor:pointer}
.nfx:hover{background:var(--c);color:#fff}
body[data-era]{background-repeat:no-repeat;background-attachment:fixed,scroll}
body[data-era=a]{background-image:radial-gradient(120% 70% at 50% -10%,rgba(124,77,196,.26),transparent 62%),linear-gradient(var(--ac2),transparent 320px)}
body[data-era=b]{background-image:radial-gradient(120% 70% at 50% -10%,rgba(224,160,48,.2),transparent 62%),linear-gradient(var(--ac2),transparent 320px)}
body[data-era=c]{background-image:radial-gradient(120% 70% at 50% -10%,rgba(255,214,102,.3),transparent 62%),linear-gradient(var(--ac2),transparent 320px)}
body[data-era=d]{background-image:radial-gradient(120% 70% at 50% -10%,rgba(120,134,160,.3),transparent 62%),linear-gradient(var(--ac2),transparent 320px)}
body[data-era=e]{background-image:radial-gradient(120% 70% at 50% -10%,rgba(224,49,49,.26),transparent 62%),linear-gradient(var(--ac2),transparent 320px)}
/* 원본의 .pr 클래스 이름 충돌(확률 막대 vs 노트 오른쪽 페이지) 정리 */
.pg.pr{display:block;margin:0;gap:0}.pg.pr b{font-weight:700}
.stg{display:inline-block;font:700 13px/1 "Noto Sans KR",sans-serif;margin-left:12px;padding:5px 11px;border-radius:14px;background:var(--ac2);color:var(--ac);vertical-align:middle;letter-spacing:0}

/* ===== v10: 확률 미리 보기 정리 ===== */
.pbar{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:5px 12px;font-size:14px;margin:11px 0}
.pbar b{font-weight:700;font-variant-numeric:tabular-nums;color:var(--ac)}
.pbar i{grid-column:1/3;position:relative;display:block;height:8px;border-radius:999px;background:var(--ac2);overflow:hidden}
.pbar i::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--v);border-radius:inherit;background:linear-gradient(90deg,var(--ac),color-mix(in srgb,var(--ac) 55%,#67e8f9))}
.pn>details:not(.tp),details.pn{border:1px solid var(--ln);border-radius:14px;padding:2px 16px;margin:12px 0;background:color-mix(in srgb,var(--ac2) 28%,var(--pn))}
.pn>details:not(.tp)[open],details.pn[open]{padding-bottom:12px}
.pn>details:not(.tp)>summary,details.pn>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;font-size:15px}
.pn>details:not(.tp)>summary::-webkit-details-marker,details.pn>summary::-webkit-details-marker{display:none}
.pn>details:not(.tp)>summary::after,details.pn>summary::after{content:"";flex:none;width:8px;height:8px;border:solid var(--mu);border-width:0 2px 2px 0;transform:rotate(45deg) translateY(-2px);transition:transform .2s}
.pn>details:not(.tp)[open]>summary::after,details.pn[open]>summary::after{transform:rotate(-135deg) translateY(-2px)}
.pn>details:not(.tp)>summary:hover,details.pn>summary:hover{color:var(--ac)}
.pb{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.pbd{font:700 11px/20px "Noto Sans KR",sans-serif;font-style:normal;border-radius:10px;padding:0 9px;background:#ffe3e3;color:#a61e1e;cursor:help}.hvb.a i:first-child{animation:hvw .9s ease}@keyframes hvw{from{width:var(--f)}}.hvs{display:block;width:100%;height:44px;margin:8px 0 2px;color:var(--tx)}.dg{display:block;width:100%;color:var(--tx);overflow:visible}.dk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}.dk>div{background:var(--ac2);border-radius:12px;padding:8px 10px;min-width:0}.dk small{display:block;color:var(--mu);font-size:11.5px;line-height:1.3}.dk b{font-size:20px;font-variant-numeric:tabular-nums}.dk em{font-style:normal;font-size:12px;margin-left:5px;font-weight:600}.dv{font-weight:700;margin:6px 0 0;font-size:14px}
/* ===== v16: 언론 탭 ===== */
:root{--mb:#2563eb;--mb2:#1e40af;--mt:#1e40af;--dct:#6d28d9}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--mt:#93c5fd;--dct:#c4b5fd}}
:root[data-theme=dark]{--mt:#93c5fd;--dct:#c4b5fd}
.mc{display:none}
main.sim .mc{display:flex}
.mz{flex-direction:column;min-height:0;border:1px solid var(--ln);border-radius:16px;background:var(--pn);overflow:hidden;box-shadow:0 16px 36px -24px rgba(37,99,235,.75)}
.mzhd{display:flex;align-items:center;gap:8px;padding:11px 14px;background:linear-gradient(120deg,var(--mb2),var(--mb) 58%,#3b82f6);color:#fff}
.mzhd b{font:400 18px/1.2 "Black Han Sans","Noto Sans KR",sans-serif;letter-spacing:.01em}
.mzhd .live{margin-left:auto;font:700 11px/1 "Noto Sans KR",sans-serif;letter-spacing:.12em;padding:4px 8px;border-radius:999px;background:rgba(255,255,255,.18)}
.mzhd .live::before{content:"";display:inline-block;width:7px;height:7px;margin-right:6px;border-radius:50%;background:#ff6b6b;animation:mzlv 1.4s ease-in-out infinite}
@keyframes mzlv{50%{opacity:.25}}
.mzx{display:none;width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;cursor:pointer;font-size:14px}
.mzl{flex:0 1 44%;min-height:96px;overflow:auto;padding:10px 12px;display:grid;gap:8px;align-content:start;background:color-mix(in srgb,var(--ac2) 18%,var(--pn))}
.mzw{margin:0;padding:14px 4px;text-align:center;font-size:13px;color:var(--mu)}
.mzn{border:1px solid var(--ln);border-left:4px solid var(--mb);border-radius:10px;padding:8px 11px;background:var(--pn);cursor:pointer;transition:box-shadow .2s,border-color .2s}
.mzn:hover{border-color:var(--mb)}.mzn:focus-visible{outline:2px solid var(--mb);outline-offset:2px}
.mzn.on{box-shadow:0 0 0 2px color-mix(in srgb,var(--mb) 45%,transparent)}
.mzn.v1{border-left-color:#0ea5e9}.mzn.v2{border-left-color:#1d4ed8}
.mzh{display:flex;align-items:center;gap:8px}.mzh small{margin-left:auto;font-size:11.5px;color:var(--mu)}
.mzt{font:700 11px/1 "Noto Sans KR",sans-serif;padding:3px 7px;border-radius:6px;background:var(--ac2);color:var(--mt)}
.mzn.k-flash .mzt,.mzn.k-obit .mzt{background:#dc2626;color:#fff}.mzn.k-obit .mzt{background:#334155}
.mzn.k-hero .mzt{background:#0ea5e9;color:#fff}
.mzn h4{margin:5px 0 0;font:700 14.5px/1.4 "Noto Sans KR",sans-serif;color:var(--tx)}
.mzb{display:grid;grid-template-columns:3em 1fr;gap:3px 8px;margin:7px 0 0;font-size:12.5px;line-height:1.5}
.mzb dt{font-weight:700;color:var(--mt)}.mzb dd{margin:0;color:var(--tx)}
.mzn:not(.on) .mzb,.mzn:not(.on) .mzu{display:none}
.mzu{margin:6px 0 0;padding:5px 9px;border-radius:8px;background:color-mix(in srgb,var(--mb) 9%,transparent);font-size:12.5px;line-height:1.5;animation:mzi .35s ease}
.mzu b{color:var(--mt);margin-right:4px}
.mzg{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;border-top:3px solid var(--mb);background:color-mix(in srgb,var(--ac2) 40%,var(--pn))}

.mzgh{position:relative;display:flex;align-items:baseline;gap:8px;padding:8px 12px 0;font-size:13px}.mzgh b{color:var(--mt)}.mzgh span{color:var(--mu);font-size:12px}

.mzc{position:relative;flex:1;min-height:0;overflow:auto;list-style:none;margin:0;padding:8px 10px 12px;display:grid;gap:6px;align-content:start}
.mzcm{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:6px 9px;border:1px solid var(--ln);border-radius:8px;background:color-mix(in srgb,var(--pn) 90%,transparent);font-size:13.5px;line-height:1.5;animation:mzi .3s ease}

/* ===== v17: 시대 날씨 ===== */
#wx{position:fixed;inset:0;width:100%;height:100%;z-index:3;pointer-events:none;display:none}
.wxl{--wc:#5b7bb0;margin:10px 0 0;padding:7px 11px;border-radius:10px;border-left:3px solid var(--wc);background:color-mix(in srgb,var(--wc) 11%,transparent);font-size:13px;line-height:1.55;animation:wxi .9s ease}

.sfb{height:6px;border-radius:4px;background:var(--ac2);margin:8px 0 14px;overflow:hidden}.sfb i{display:block;height:100%;background:#f59f00}
.sfr{font-weight:500;border-left:4px solid #f59f00;padding-left:12px}
